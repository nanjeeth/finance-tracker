services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./data/finance.db
      - UPLOADS_DIR=/app/uploads
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
